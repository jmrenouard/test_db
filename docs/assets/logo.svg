<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="test_db Logo">
  <defs>
    <!-- Dark Obsidian Squircle Surface -->
    <linearGradient id="tbBgSurf" x1="4" y1="4" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13161b"/>
      <stop offset="100%" stop-color="#08090a"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="tbCoreGlow" cx="60" cy="56" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090a" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Top Border Accent -->
    <linearGradient id="tbSpecBorder" x1="12" y1="4" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Outer Orbital Ring Gradient -->
    <linearGradient id="tbOrbitGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Database Cylinder Fill -->
    <linearGradient id="tbDbBody" x1="36" y1="36" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="55%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#07111c"/>
    </linearGradient>

    <!-- Database Top Cap Accent -->
    <linearGradient id="tbDbCap" x1="36" y1="35" x2="84" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Amber Benchmark / Verification Core -->
    <linearGradient id="tbAmberCore" x1="50" y1="54" x2="70" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Obsidian Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#tbBgSurf)"/>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#tbCoreGlow)"/>
  <rect x="4" y="4" width="112" height="112" rx="26" stroke="url(#tbSpecBorder)" stroke-width="1.5"/>
  <rect x="7" y="7" width="106" height="106" rx="23" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Calibration Ticks -->
  <line x1="60" y1="12.5" x2="60" y2="18.5" stroke="#10b981" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="97.8" y1="81.8" x2="102.2" y2="84.4" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="22.2" y1="81.8" x2="17.8" y2="84.4" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Multi-Engine Orbital Ring -->
  <circle cx="60" cy="60" r="37" stroke="#1e293b" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 27.5 78.5 A 37 37 0 1 1 92.5 78.5" stroke="url(#tbOrbitGrad)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 35 87 A 37 37 0 0 0 85 87" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="3 4" stroke-linecap="round"/>

  <!-- Central Stacked Multi-Engine Database Cylinder -->
  <path d="M 37 44 V 76 C 37 81.8 47.3 86 60 86 C 72.7 86 83 81.8 83 76 V 44 Z"
        fill="url(#tbDbBody)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.4"/>

  <!-- Cylinder Tier Dividers (3NF / Multi-Engine Layers) -->
  <path d="M 37 55.5 C 37 61.3 47.3 65.5 60 65.5 C 72.7 65.5 83 61.3 83 55.5"
        stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.3"/>
  <path d="M 37 66.5 C 37 72.3 47.3 76.5 60 76.5 C 72.7 76.5 83 72.3 83 66.5"
        stroke="#10b981" stroke-opacity="0.55" stroke-width="1.3"/>

  <!-- Top Database Cap -->
  <ellipse cx="60" cy="44" rx="23" ry="8.5" fill="#0b1c2c" stroke="url(#tbDbCap)" stroke-width="1.8"/>
  <ellipse cx="60" cy="44" rx="14" ry="4.4" stroke="#6ee7b7" stroke-opacity="0.45" stroke-width="1.1"/>

  <!-- Telemetry / Checksum Verification Pulse Badge -->
  <circle cx="80" cy="76" r="11" fill="#090d14" stroke="url(#tbAmberCore)" stroke-width="1.6"/>
  <path d="M 75.5 76.2 L 78.6 79.3 L 85.0 72.8" stroke="#fde047" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
